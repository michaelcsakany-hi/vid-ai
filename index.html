<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TensorFlow.js Graph Disconnected Fix</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    button { padding: 10px 20px; margin: 10px 5px; font-size: 16px; cursor: pointer; }
    #video-container { margin: 20px 0; border: 1px solid #ccc; background: #000; width: 320px; height: 240px; display: flex; align-items: center; justify-content: center; color: white; }
    #output { margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f9f9f9; min-height: 200px; white-space: pre-wrap; font-family: monospace; overflow-x: auto; }
    .error { color: red; }
    .success { color: green; }
    .info { color: blue; }
  </style>
</head>
<body>
  <h1>Fix for "Graph disconnected" Error</h1>
  <p>
    The error <code>Graph disconnected: cannot obtain value for tensor [object Object] at layer "input4"</code>
    occurs when an input layer is used in the graph but not listed in the model's inputs.
  </p>

  <div id="video-container">
    <video id="webcam" autoplay playsinline width="320" height="240"></video>
  </div>

  <button onclick="runBuggy()">Run Buggy Code (Trigger Error)</button>
  <button onclick="runFixed()">Run Fixed Code (Success)</button>
  <button onclick="startCamera()">Start Camera</button>

  <div id="output">Click a button above... Output will appear here instead of console.</div>

  <script>
    // Redirect console.log to the page
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;

    function logToPage(msg, type = 'normal') {
      const output = document.getElementById('output');
      const div = document.createElement('div');
      div.textContent = typeof msg === 'object' ? JSON.stringify(msg, null, 2) : msg;
      if (type === 'error') div.className = 'error';
      if (type === 'success') div.className = 'success';
      if (type === 'info') div.className = 'info';
      output.appendChild(div);
      output.scrollTop = output.scrollHeight; // Auto-scroll to bottom
    }

    console.log = function(...args) {
      originalLog.apply(console, args);
      logToPage(args.join(' '));
    };

    console.error = function(...args) {
      originalError.apply(console, args);
      logToPage(args.join(' '), 'error');
    };

    console.warn = function(...args) {
      originalWarn.apply(console, args);
      logToPage(args.join(' '), 'info');
    };

    function clearLog() {
      document.getElementById('output').innerHTML = '';
    }

    async function startCamera() {
      const video = document.getElementById('webcam');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        logToPage('Camera started successfully.', 'success');
      } catch (e) {
        logToPage('Error accessing camera: ' + e.message, 'error');
        logToPage('Note: Camera access requires HTTPS or localhost.', 'info');
      }
    }

    function createModel(includeInput4) {
      // Define symbolic input tensors
      const input1 = tf.input({shape: [10], name: 'input1'});
      const input2 = tf.input({shape: [10], name: 'input2'});
      const input3 = tf.input({shape: [10], name: 'input3'});
      const input4 = tf.input({shape: [10], name: 'input4'}); // Used in graph below

      // Construct the computation graph
      // Note: We use input4 here.
      const dense1 = tf.layers.dense({units: 32}).apply(input4);
      const output = tf.layers.dense({units: 1}).apply(dense1);

      // Define the list of inputs for the model
      const inputs = [input1, input2, input3];

      // THE FIX: We must include input4 in the inputs list because it is used in the graph.
      if (includeInput4) {
        inputs.push(input4);
      }

      // Create the model
      return tf.model({inputs: inputs, outputs: output});
    }

    async function runBuggy() {
      clearLog();
      logToPage('Attempting to create model omitting input4...', 'info');
      try {
        // Buggy: We pass includeInput4 = false
        const model = createModel(false);
        logToPage('Unexpected success! The model should have failed.', 'error');
      } catch (e) {
        logToPage('Caught expected error:', 'error');
        logToPage(e.message, 'error');
        logToPage('Explanation: The error "Graph disconnected" occurs because "input4" was used to compute the output but was not listed in the inputs array.', 'info');
      }
    }

    async function runFixed() {
      clearLog();
      logToPage('Attempting to create model including input4...', 'info');
      try {
        // Fixed: We pass includeInput4 = true
        const model = createModel(true);
        logToPage('Success! Model created.', 'success');

        // Capture model summary
        model.summary(undefined, [0.5, 0.5, 0.5, 0.5], (line) => logToPage(line));

        // Verify prediction works with dummy data
        const prediction = model.predict([
          tf.zeros([1, 10]),
          tf.zeros([1, 10]),
          tf.zeros([1, 10]),
          tf.zeros([1, 10])
        ]);

        // Convert tensor to array to display
        const result = await prediction.array();
        logToPage('Prediction successful: ' + JSON.stringify(result), 'success');

      } catch (e) {
        logToPage('Error: ' + e.message, 'error');
      }
    }
  </script>
</body>
</html>
